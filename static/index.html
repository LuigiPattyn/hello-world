<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Hello, World!</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="aurora aurora--teal"></div>
    <div class="aurora aurora--rose"></div>
    <div class="grid"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <main class="stage">
    <p class="terminal">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="terminal__path">~ /hello/hello.rs</span>
    </p>

    <p class="eyebrow"><span class="caret" aria-hidden="true"></span>first program · rebuilt in rust</p>

    <h1 class="hero" aria-label="Hello, World!">
      <span class="hero__letters" aria-hidden="true"><span class="l" style="--i:0">H</span><span class="l" style="--i:1">e</span><span class="l" style="--i:2">l</span><span class="l" style="--i:3">l</span><span class="l" style="--i:4">o</span><span class="l spark" style="--i:5">,</span><span class="gap"> </span><span class="l" style="--i:7">W</span><span class="l" style="--i:8">o</span><span class="l" style="--i:9">r</span><span class="l" style="--i:10">l</span><span class="l" style="--i:11">d</span><span class="l" style="--i:12">!</span></span>
    </h1>

    <p class="sub">
      Served from a single Rust binary — the standard library and nothing else.
      No dependencies, no build step but <code>cargo run</code>.
    </p>

    <nav class="links">
      <a class="link" href="/hello">
        plain text
        <span class="link__hint">GET /hello</span>
      </a>
    </nav>

    <p class="status">
      <span><b>200</b> OK</span>
      <span>rust · std only</span>
      <span>port 8000</span>
    </p>
  </main>
</body>
</html>
