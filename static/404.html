<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Not found</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="aurora aurora--teal"></div>
    <div class="aurora aurora--rose"></div>
    <div class="grid"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <main class="stage stage--404">
    <p class="eyebrow">404 · nothing here</p>
    <h1 class="hero" aria-label="Not found">404</h1>
    <p class="sub">
      No page lives at that address. The only door this server knows is
      <code>/</code>.
    </p>
    <nav class="links">
      <a class="link" href="/">
        back to Hello, World!
        <span class="link__hint">GET /</span>
      </a>
    </nav>
  </main>
</body>
</html>
